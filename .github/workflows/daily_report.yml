name: Process Reports
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: pip install google-generativeai pdfplumber
      - run: python main.py
        env: { GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }} }
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add data/
          git commit -m "update" || echo "no changes"
          git push
