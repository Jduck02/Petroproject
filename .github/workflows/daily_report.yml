name: Daily Report

on:
  push:
    paths:
      - 'reports/**'
  workflow_dispatch:

permissions: # <--- ADD THIS BLOCK
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Use v4 to avoid Node.js warnings
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Tell it to use the token
      
      # ... rest of your steps ...

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openai pydantic pdfplumber

      - name: Run processor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py

      - name: Commit and push new report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update report data"
            git push
          fi
