<!DOCTYPE html>
<html>
<head>
    <title>Petro Market Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-50">
    <h1 class="text-3xl font-bold mb-4">Petrochemical Reports</h1>
    <div id="report-container" class="bg-white p-6 shadow rounded">
        <h2 id="date" class="text-xl font-bold">Loading...</h2>
        <div id="content" class="mt-4"></div>
    </div>
    <script>
        async function fetchReport() {
            const date = new Date().toISOString().split('T')[0];
            try {
                const res = await fetch(`./data/report_${date}.json`);
                const data = await res.json();
                document.getElementById('date').innerText = "Date: " + data.date;
                document.getElementById('content').innerText = data.summary;
            } catch { document.getElementById('content').innerText = "No report for today."; }
        }
        fetchReport();
    </script>
</body>
</html>
