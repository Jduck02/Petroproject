<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Petrochemical Market Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function checkPassword() {
            const password = prompt("Please enter the access password:");
            if (password === "YNCC1015") {
                document.getElementById('content').style.display = 'block';
            } else {
                alert("Incorrect password.");
                window.location.reload();
            }
        }
    </script>
</head>
<body class="bg-gray-100" onload="checkPassword()">
    <div id="content" style="display: none;">
        <nav class="bg-slate-900 text-white p-4 font-bold">Petrochemical Intelligence</nav>
        <main class="p-6">
            <div class="bg-white p-6 shadow rounded mb-6">
                <h2 id="report-date" class="text-xl font-bold">Loading...</h2>
                <div id="ai-summary" class="mt-4"></div>
            </div>
            <canvas id="priceChart" class="bg-white p-4 shadow rounded"></canvas>
        </main>
    </div>
    <script>
        async function loadData() {
            try {
                // Fetch the file generated by your GitHub Action
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`./data/report_${today}.json`);
                const data = await response.json();
                document.getElementById('report-date').innerText = "Market Report: " + data.report_metadata.report_date;
                document.getElementById('ai-summary').innerText = data.ai_synthesis.executive_summary;
                
                const ctx = document.getElementById('priceChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.market_data.map(i => i.commodity),
                        datasets: [{ label: 'Avg Price (USD/MT)', data: data.market_data.map(i => (i.prices.Platts + i.prices.ICIS + i.prices.Argus)/3), backgroundColor: '#3b82f6' }]
                    }
                });
            } catch (e) { document.getElementById('ai-summary').innerText = "Data pending..."; }
        }
        loadData();
    </script>
</body>
</html>
